name: Algo no funciona
description: Reporta un error en el sitio
labels: [web]
body:
  - type: input
    id: url
    attributes:
      label: Página
      placeholder: https://agenticstack.cl/...
    validations:
      required: true
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó y qué esperabas?
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y dispositivo
      placeholder: Firefox 140, Android
  - type: dropdown
    id: tema
    attributes:
      label: Modo
      options:
        - Claro
        - Oscuro
        - No sé
