version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [infra]
    commit-message:
      prefix: "chore(deps)"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "prettier-plugin-tailwindcss"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*", "typescript", "globals"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [infra]
    commit-message:
      prefix: "chore(ci)"
